<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTHS120 | Calculus and Linear Algebra 1</title>
        <!-- KaTeX Integration -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
    <style>
        :root {
            --bg: #f8fafc; --text: #0f172a; --card: #ffffff; --border: #cbd5e1;
            --accent: #d97706; --accent-hover: #b45309;
            --telemetry-bg: #f8fafc; --telemetry-text: #334155;
            --track1-bg: #fffbeb; --track2-bg: #fff7ed;
            --font-ui: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body { font-family: var(--font-ui); background: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { border-bottom: 2px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; }
        .module-content { background: var(--card); padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); margin-bottom: 2rem; border: 1px solid var(--border); }
        h1, h2, h3 { color: #0f172a; font-family: var(--font-ui); }
        a { color: var(--accent); text-decoration: none; font-weight: 500; }
        a:hover { color: var(--accent-hover); text-decoration: underline; }
    </style>

</head>
<body>

    <header>
        <h1>MTHS120</h1>
        <p>Calculus and Linear Algebra 1 • Curriculum Index</p>
    </header>

    <main class="container">
        <div class="grid-container" id="curriculum-grid">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <script>
        const courseData = [
            { week: 1, topic: "Topic 1: Sets and Numbers", readings: ["Sections 1, 2, 3"], assessment: null },
            { week: 2, topic: "Topic 2: Limits of sequences", readings: ["Sections 4, 5, 6"], assessment: null },
            { week: 3, topic: "Topic 3: Functions", readings: ["Sections 7, 8, 9"], assessment: "Assignment 1" },
            { week: 4, topic: "Topic 4: Continuity and limits of functions", readings: ["Sections 10, 11, 12"], assessment: "Assignment 2 (Möbius)" },
            { week: 5, topic: "Topic 5: Derivatives", readings: ["Sections 13, 14, 15"], assessment: "Assignment 3" },
            { week: 6, topic: "Topic 6: Integration", readings: ["Sections 16, 17, 18"], assessment: "Assignment 4" },
            { week: 7, topic: "Assessment and Intensive Period 1", readings: [], intensive: true },
            { week: 8, topic: "Assessment and Intensive Period 1", readings: [], intensive: true },
            { week: 9, topic: "Topic 6: Integrals (contd.)", readings: ["Sections 19, 20, 21"], assessment: "Assignment 5 (Möbius)" },
            { week: 10, topic: "Topic 7: Systems of linear equations", readings: ["Sections 22, 23, 24"], assessment: "Assignment 6 (Möbius)" },
            { week: 11, topic: "Topic 8: Applications of linear algebra and complex numbers", readings: ["Sections 25, 26, 27"], assessment: "Assignment 7 (Möbius)" },
            { week: 12, topic: "Topic 9: Dot and cross products", readings: ["Sections 28, 29"], assessment: "Assignment 8" },
            { week: 13, topic: "Revision", readings: ["Core Concept Review"], assessment: "Assignment 9 (Möbius)" },
            { week: 14, topic: "Assessment and Intensive Period 2", readings: [], intensive: true }
        ];

        function buildCurriculumGrid(data) {
            const grid = document.getElementById('curriculum-grid');

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = item.intensive ? 'card intensive-card' : 'card';

                let cardContent = `
                    <div class="card-header">
                        <span class="week-label">Week ${item.week}</span>
                        <h2 class="topic-title">${item.topic}</h2>
                    </div>
                    <div class="card-body">
                `;

                if (item.readings.length > 0) {
                    cardContent += `<ul class="reading-list">`;
                    item.readings.forEach(reading => {
                        cardContent += `<li>${reading}</li>`;
                    });
                    cardContent += `</ul>`;
                }

                if (item.assessment) {
                    cardContent += `<span class="assessment-badge">${item.assessment}</span>`;
                }

                cardContent += `</div>`;

                if (!item.intensive) {
                    cardContent += `
                        <div class="card-footer">
                            <a href="${item.week === 1 ? 'week1.html' : '#'}" class="module-link">View Module</a>
                            <a href="#" class="module-link" style="background-color: var(--text-muted);">Simulators</a>
                        </div>
                    `;
                }

                card.innerHTML = cardContent;
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            buildCurriculumGrid(courseData);
        });
    </script>
</body>
</html>
